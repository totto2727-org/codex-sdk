name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - name: Verify MoonBit module
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          moon update
          moon info
          moon check --target "${{ matrix.target }}"
          moon test --target "${{ matrix.target }}" --jobs 1 --no-parallelize
          moon build --target "${{ matrix.target }}"
          moon package --list
