name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    env:
      NIX_DEV_SHELL: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@050a0db1c73bfd8ddc0816c2c6414fd3d03fabf4
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@050a0db1c73bfd8ddc0816c2c6414fd3d03fabf4
        with:
          dev-shell: ${{ env.NIX_DEV_SHELL }}
      - name: Verify Codex CLI
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#$NIX_DEV_SHELL")"
          codex --version
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@050a0db1c73bfd8ddc0816c2c6414fd3d03fabf4
        with:
          dev-shell: ${{ env.NIX_DEV_SHELL }}
