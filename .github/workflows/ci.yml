name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci-tools
      - name: Add Codex CLI to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop .#ci-tools --command bash -euc '
            path=$(command -v codex)
            "$path" --version
            dirname "$path" >> "$GITHUB_PATH"
          '
      - uses: totto2727-org/monorepo/.github/actions/setup-moonbit@4cdb3e1de3140fcec4812e568da91209962975c4
      - uses: totto2727-org/monorepo/.github/actions/check-moonbit@4cdb3e1de3140fcec4812e568da91209962975c4
